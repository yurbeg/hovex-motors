<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Գտեք ձեր բյուջեին համապատասխան մեքենա և խորհրդակցեք Hovex Motors-ի մասնագետի հետ։" />
    <meta name="theme-color" content="#faf8f4" />
    <script>
      (() => {
        const storageKey = "hovex-theme";
        let storedTheme = null;
        let prefersDark = false;

        try {
          const value = window.localStorage.getItem(storageKey);
          storedTheme = value === "light" || value === "dark" ? value : null;
        } catch {
          storedTheme = null;
        }

        if (!storedTheme) {
          try {
            prefersDark = typeof window.matchMedia === "function"
              && window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            prefersDark = false;
          }
        }

        const theme = storedTheme || (prefersDark ? "dark" : "light");
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#11110f" : "#faf8f4",
        );
      })();
    </script>
    <title>Hovex Motors — մեքենաների ընտրություն և ներմուծում</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
